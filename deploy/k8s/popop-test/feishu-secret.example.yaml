# 飞书 OAuth 凭据（可选）。复制为 feishu-secret.yaml 填好后 apply，不要把真实值提交进 git。
#
#   cp feishu-secret.example.yaml feishu-secret.yaml && $EDITOR feishu-secret.yaml
#   kubectl --kubeconfig ~/.kube/popop-test.yaml apply -f feishu-secret.yaml
#   kubectl --kubeconfig ~/.kube/popop-test.yaml -n sub2api rollout restart deploy/sub2api
#
# 与 SigNoz（otel.popop.dev / otel-test.popop.dev）飞书 SSO 使用同一个飞书应用：
# App ID / App Secret 在飞书开放平台 → 该应用 → 凭证与基础信息；
# 并需在 安全设置 → 重定向 URL 中加上：https://sub2api.popop.ai/api/v1/auth/oauth/feishu/callback
#
# 另一种方式：不建 Secret，直接在 sub2api 后台「系统设置 → 飞书登录」里启用并填写（存 DB，优先级高于 env）。
apiVersion: v1
kind: Secret
metadata:
  name: sub2api-feishu
  namespace: sub2api
  labels:
    app.kubernetes.io/part-of: sub2api
type: Opaque
stringData:
  FEISHU_CONNECT_ENABLED: "true"
  FEISHU_CONNECT_CLIENT_ID: "cli_xxxxxxxxxxxxxxxx"
  FEISHU_CONNECT_CLIENT_SECRET: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
