apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub2api
  namespace: sub2api
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: sub2api
spec:
  replicas: 1
  # 单副本 + PVC(RWO)，必须 Recreate，避免新旧 Pod 抢同一块盘
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: sub2api
    spec:
      # ACR 私有仓库拉取凭据：从 signoz 命名空间的 imagepublicsecret 复制而来
      # （kubectl -n signoz get secret imagepublicsecret -o json | 改 name/namespace | kubectl apply）。
      # sub2api 命名空间不在 kube-system/acr-configuration 的 watch-namespace 里，凭据不会自动注入。
      imagePullSecrets:
        - name: acr-pull-secret
      securityContext:
        fsGroup: 1000
      containers:
        - name: sub2api
          # 由 apply.sh 通过 kubectl set image 覆盖为具体 tag；这里保留一个可用的默认值。
          # ACR 里还没有 popop-i18n-test/sub2api 仓库（当前 RAM 账号无权创建），
          # 暂时复用 popop-i18n-test/data-test 仓库、以 sub2api-* tag 区分。
          image: wjm20260616-registry.ap-northeast-1.cr.aliyuncs.com/popop-i18n-test/data-test:sub2api-feishu-20260914-1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sub2api-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sub2api-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sub2api-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sub2api-secrets
                  key: JWT_SECRET
            - name: TOTP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sub2api-secrets
                  key: TOTP_ENCRYPTION_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sub2api-secrets
                  key: ADMIN_PASSWORD
            # ---- 飞书 OAuth（可选）：Secret 不存在时忽略，改由后台设置页配置 ----
            - name: FEISHU_CONNECT_ENABLED
              valueFrom:
                secretKeyRef:
                  name: sub2api-feishu
                  key: FEISHU_CONNECT_ENABLED
                  optional: true
            - name: FEISHU_CONNECT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sub2api-feishu
                  key: FEISHU_CONNECT_CLIENT_ID
                  optional: true
            - name: FEISHU_CONNECT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sub2api-feishu
                  key: FEISHU_CONNECT_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sub2api-data
